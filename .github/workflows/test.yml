name: tests

# Runs on every pull request. Set "tests" as a required status check in the
# main branch ruleset so nothing that breaks the tests or build can merge
# (main deploys straight to the live site and game server).
on:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
